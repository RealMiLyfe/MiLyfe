name: Bug Report
description: File a bug report
title: "[BUG]: "
labels: ["type:bug"]
body:
  - type: markdown
    attributes:
      value: |
        Thanks for taking the time to fill out this bug report!
  - type: input
    id: issue-id
    attributes:
      label: Issue ID
      description: Leave blank for maintainers to fill in
      placeholder: e.g., MLY-1234
    validations:
      required: false
  - type: textarea
    id: system-outcome
    attributes:
      label: User or System Outcome
      description: What happened? What did you expect to happen?
      placeholder: Describe the bug here...
    validations:
      required: true
  - type: textarea
    id: steps-to-reproduce
    attributes:
      label: Steps to Reproduce
      description: How to reproduce the bug
      placeholder: |
        1. Go to '...'
        2. Click on '....'
        3. Scroll down to '....'
        4. See error
    validations:
      required: true
  - type: dropdown
    id: affected-os
    attributes:
      label: Affected OS
      description: Which operating system(s) are affected?
      multiple: true
      options:
        - kernel
        - onboard
        - psyche
        - agent
        - market
        - forge
        - money
        - scale
        - device
        - security
        - dev
    validations:
      required: true
  - type: textarea
    id: expected-behavior
    attributes:
      label: Expected Behavior
      description: What did you expect to happen?
    validations:
      required: true
  - type: textarea
    id: actual-behavior
    attributes:
      label: Actual Behavior
      description: What actually happened?
    validations:
      required: true
  - type: textarea
    id: logs
    attributes:
      label: Logs
      description: Please copy and paste any relevant log output.
      placeholder: |
        Paste logs here...
    validations:
      required: false
  - type: checkboxes
    id: tests
    attributes:
      label: Tests
      description: Have you tested this in different environments?
      options:
        - label: I have tested this in a synthetic/test environment
          required: true
        - label: I have verified this is not a duplicate issue
          required: true